server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /pulse-trassirmock

springdoc:
  api-docs:
    version: openapi_3_0
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

trassir:
  mock:
    sdk-password: mock-sdk-password
    session-ttl: PT30M
    max-events-per-response: 100

    generate-events: true
    event-generation-interval: PT1S
    event-generation-jitter: PT5S

    event-types:
      - CONNECTION_LOST
      - CONNECTION_ESTABLISHED
      - LOGIN_SUCCESS
      - LOGIN_FAILED

    login-users:
      - admin
      - КРО
      - Administrator

    login-ips:
      - 10.50.5.174
      - 10.10.11.185
      - 10.10.13.144
spring:
  output:
    ansi:
      enabled: always

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%t] %clr(%logger{36}){cyan} : %m%n%wEx"
