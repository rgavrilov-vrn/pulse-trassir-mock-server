server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /pulse-trassirmock

springdoc:
  api-docs:
    version: openapi_3_0
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

trassir:
  mock:
    sdk-password: mock-sdk-password
    session-ttl: PT30M
    max-events-per-response: 100
    generate-events: true
    event-generation-interval: PT1S
